    <!-- CATEGORY HERO -->
    <section class="portfolio-detail-hero">

        <div class="container">

            <a href="index.html#portfolio" class="portfolio-back-link">
                ← Back to Portfolio
            </a>

            <h1 id="categoryTitle">Our Projects</h1>

            <p id="categoryDescription"></p>

            <div style="color:#d29290; font-size:13px; font-weight:700;">
                <span id="projectCount">0</span> PROJECTS
            </div>

        </div>

    </section>


    <!-- PROJECT GALLERY -->
    <section class="container">

        <div id="portfolioDetailGrid" class="portfolio-detail-grid"></div>

        <div id="portfolioEmpty" class="portfolio-empty"
             style="display:none;">

            <h3>No Projects Found</h3>

            <p>There are currently no projects in this category.</p>

        </div>

    </section>


    <script>

        const categories = [
            {
                id: "logo",
                name: "Logo Embroidery",
                description: "Explore our collection of custom embroidered logos, corporate branding and professional stitching samples."
            },
            {
                id: "apparel",
                name: "Apparel Branding",
                description: "Discover our apparel embroidery projects, including uniforms, shirts, jackets and branded clothing."
            },
            {
                id: "3D-puff",
                name: "3D Puff",
                description: "Explore our premium dimensional embroidery and raised 3D puff stitching projects."
            },
            {
                id: "customOrder",
                name: "Custom Orders",
                description: "A collection of unique embroidery projects created for custom customer requirements."
            },
            {
                id: "patches",
                name: "Embroidery Patches",
                description: "Browse our custom embroidered patches and detailed patch stitching work."
            },
            {
                id: "applique",
                name: "Applique",
                description: "Explore our applique embroidery designs and creative fabric stitching projects."
            },
            {
                id: "pet",
                name: "Pet Embroidery",
                description: "Discover our personalized pet embroidery artwork and designs."
            },
            {
                id: "medicalStitch",
                name: "Medical Stitch",
                description: "Professional medical embroidery and branding projects."
            },
            {
                id: "kids-sew-out",
                name: "Kids Sew-Out",
                description: "Explore creative embroidery samples designed for kids."
            },
            {
                id: "cap-sew-out",
                name: "Cap Sew-Out",
                description: "Browse our cap embroidery, custom logos and professional headwear stitching."
            },
            {
                id: "portraitStitch",
                name: "Portrait Stitch",
                description: "Detailed portrait embroidery and artistic stitching projects."
            },
            {
                id: "tinyDetailedDesigns",
                name: "Tiny Detailed Designs",
                description: "Explore our small-scale embroidery projects with precise and detailed stitching."
            }
        ];


        const params = new URLSearchParams(window.location.search);

        const categoryId = params.get("category");

        const category = categories.find(
            x => x.id === categoryId
        );


        const grid = document.getElementById("portfolioDetailGrid");

        const empty = document.getElementById("portfolioEmpty");


        if (!category) {

            document.getElementById("categoryTitle").textContent =
                "Category Not Found";

            document.getElementById("categoryDescription").textContent =
                "The requested portfolio category does not exist.";

            empty.style.display = "block";

        } else {

            document.getElementById("categoryTitle").textContent =
                category.name;

            document.getElementById("categoryDescription").textContent =
                category.description;

            loadCategoryProjects();

        }


        async function loadCategoryProjects() {

            try {

                const response = await fetch("index.html");

                if (!response.ok) {
                    throw new Error("Unable to load portfolio data.");
                }

                const html = await response.text();

                const parser = new DOMParser();

                const doc = parser.parseFromString(
                    html,
                    "text/html"
                );

                const items = doc.querySelectorAll(
                    ".portfolio-source .shuffle-item"
                );

                let projectCount = 0;

                items.forEach(item => {

                    let groups = [];

                    try {

                        groups = JSON.parse(
                            item.getAttribute("data-groups") || "[]"
                        );

                    } catch {
                        return;
                    }

                    if (!groups.includes(category.id)) return;


                    // Get images
                    const images = item.querySelectorAll("img");

                    images.forEach(img => {

                        const src = img.getAttribute("src");

                        if (!src) return;

                        createGalleryItem(
                            src,
                            "image",
                            img.getAttribute("alt") || category.name
                        );

                        projectCount++;

                    });


                    // Get videos, if available
                    const videos = item.querySelectorAll("video");

                    videos.forEach(video => {

                        const source = video.querySelector("source");

                        const src = video.getAttribute("src") ||
                            (source && source.getAttribute("src"));

                        if (!src) return;

                        createGalleryItem(
                            src,
                            "video",
                            "Embroidery Video"
                        );

                        projectCount++;

                    });

                });


                document.getElementById("projectCount").textContent =
                    projectCount;

                if (projectCount === 0) {
                    empty.style.display = "block";
                }

            } catch (error) {

                console.error(error);

                empty.style.display = "block";

            }

        }


function createGalleryItem(src, type, title) {

    const item = document.createElement("div");
    item.className = "portfolio-detail-item";

    if (type === "image") {

        const img = document.createElement("img");

        img.src = src;
        img.alt = title;
        img.loading = "lazy";

        item.appendChild(img);

    } 
    else if (type === "video") {

        const video = document.createElement("video");

        // Resolve video path from index.html
        const videoUrl = new URL(
            src,
            new URL("index.html", window.location.href)
        ).href;

        const extension = src.split("?")[0].split(".").pop().toLowerCase();

        const mimeTypes = {
            mp4: "video/mp4",
            webm: "video/webm",
            ogv: "video/ogg"
        };

        const source = document.createElement("source");

        source.src = videoUrl;
        source.type = mimeTypes[extension] || "video/mp4";

        video.appendChild(source);

        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;
        video.muted = false;

        video.addEventListener("error", function () {
            console.error("Video loading failed:", videoUrl);
        });

        item.appendChild(video);

    }

    const label = document.createElement("div");

    label.className = "portfolio-media-label";
    label.textContent = title;

    item.appendChild(label);

    grid.appendChild(item);
}

    </script>

<style>
        body {
            background: #fff;
        }

        .portfolio-empty {
            text-align: center;

    background: #0b1d2b !important;
    padding: 65px 0 !important;
    margin: 0 0 50px !important;
    text-align: left !important;
}

.portfolio-detail-hero h1 {
    color: #fff !important;

    font-weight: 800 !important;
    margin: 0 0 15px !important;

    color: #c5cdd3 !important;

    color: #d29290 !important;

    margin-bottom: 25px;
}

.portfolio-detail-grid {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 25px !important;

    padding-bottom: 70px;
}

.portfolio-detail-item {

    }
}
